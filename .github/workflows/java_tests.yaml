name: Java Tests
on: push
jobs:
  run_java_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2
      - name: Set up JDK 23
        uses: actions/setup-java@v1
        with:
          java-version: 23
      - name: Run tests with Gradle
        run: gradle test
